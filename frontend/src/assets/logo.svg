<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="54" stroke="currentColor" stroke-width="3.5"/>

  <!-- Heartbeat / pulse line on left side -->
  <polyline
    points="6,60 20,60 25,48 32,72 38,54 44,60 56,60"
    stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />

  <!-- City skyline buildings on right side -->
  <!-- Building 1 (tallest, center) -->
  <rect x="62" y="38" width="8" height="34" rx="1" fill="currentColor"/>
  <!-- Antenna on center building -->
  <line x1="66" y1="38" x2="66" y2="32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Building 2 (left of center) -->
  <rect x="54" y="50" width="7" height="22" rx="1" fill="currentColor"/>
  <!-- Building 3 (right of center) -->
  <rect x="71" y="46" width="7" height="26" rx="1" fill="currentColor"/>
  <!-- Building 4 (far right) -->
  <rect x="79" y="54" width="6" height="18" rx="1" fill="currentColor"/>
  <!-- Building 5 (far left of skyline) -->
  <rect x="47" y="56" width="6" height="16" rx="1" fill="currentColor"/>

  <!-- Ground line -->
  <line x1="44" y1="72" x2="88" y2="72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
</svg>
